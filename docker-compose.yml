services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-MyPl4ntCare_Str0ng!}
    ports:
      - "1433:1433"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "db", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:-MyPl4ntCare_Str0ng!}", "-C", "-b", "-i", "/scripts/01_schema.sql"]
    restart: "no"

  api:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db,1433;Database=db_usuario;User Id=sa;Password=${MSSQL_SA_PASSWORD:-MyPl4ntCare_Str0ng!};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY:-clave-docker-solo-desarrollo-cambiala-0123456789-abcdef}
    ports:
      - "5216:8080"